<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="studio_grad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="studio_shadow" x="0" y="0" width="180" height="180" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Studio Squircle -->
  <rect width="180" height="180" rx="42" fill="url(#studio_grad)" />
  <!-- Geometric Studio Diamond -->
  <g filter="url(#studio_shadow)">
    <polygon points="90,36 142,90 90,144 38,90" fill="#ffffff" />
    <polygon points="90,58 120,90 90,122 60,90" fill="#dc2626" />
    <polygon points="90,74 104,90 90,106 76,90" fill="#ffffff" />
  </g>
</svg>
